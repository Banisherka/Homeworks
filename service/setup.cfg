[metadata]
name = habit_tracker
version = 1.0.0
description = API трекера привычек: пользователь заводит привычки («пить воду», «бегать»), смотрит их список, правит и удаляет.  **Зачем этот API:** чтобы мобильное и веб-приложение работали с одним и тем же списком привычек пользователя и никто не видел чужие.  **Договорённости** * Каждый запрос требует JWT в заголовке Authorization: Bearer (JWT). * Пользователь видит и меняет только свои привычки. * Наружу отдаём только DTO из components/schemas. Внутренние поля хранилища   (ownerId, служебный номер строки в БД, версия записи для блокировок, deletedAt)   в ответах и запросах не появляются: владелец определяется по токену. 
long_description = file: README.md
keywords = OpenAPI Habit Tracker API
python_requires = >= 3.11.*
classifiers =
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.11

[options]
install_requires =
    fastapi[all]
    PyJWT>=2.7
setup_requires = setuptools
package_dir = =src
packages = find_namespace:

[options.packages.find]
where = src
