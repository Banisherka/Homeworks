openapi: 3.0.3
info:
  title: Habit Tracker API
  version: 1.0.0
  description: |
    API трекера привычек: пользователь заводит привычки («пить воду», «бегать»),
    смотрит их список, правит и удаляет.

    **Зачем этот API:** чтобы мобильное и веб-приложение работали с одним и тем же
    списком привычек пользователя и никто не видел чужие.

    **Договорённости**
    * Каждый запрос требует JWT в заголовке Authorization: Bearer (JWT).
    * Пользователь видит и меняет только свои привычки.
    * Наружу отдаём только DTO из components/schemas. Внутренние поля хранилища
      (ownerId, служебный номер строки в БД, версия записи для блокировок, deletedAt)
      в ответах и запросах не появляются: владелец определяется по токену.
servers:
  - url: http://localhost:8080/api/v1
    description: Локальный запуск
tags:
  - name: habits
    description: Привычки текущего пользователя

paths:
  /habits:
    get:
      tags: [habits]
      operationId: listHabits
      summary: Список привычек текущего пользователя
      description: Возвращает страницу привычек. Чужие привычки в выдачу не попадают.
      parameters:
        - name: status
          in: query
          description: Какие привычки показывать.
          schema:
            $ref: '#/components/schemas/StatusFilter'
        - name: frequency
          in: query
          description: Фильтр по периодичности.
          schema:
            $ref: '#/components/schemas/Frequency'
        - name: limit
          in: query
          description: Сколько записей вернуть.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: Сколько записей пропустить с начала.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Страница привычек.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabitPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - bearerAuth: []
    post:
      tags: [habits]
      operationId: createHabit
      summary: Создать привычку
      description: Создаёт привычку для текущего пользователя. Владелец берётся из токена, а не из тела запроса.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HabitCreate'
            example:
              title: Пить воду
              description: Два литра в день
              frequency: DAILY
              targetPerPeriod: 1
      responses:
        '201':
          description: Привычка создана.
          headers:
            Location:
              description: Адрес созданной привычки.
              schema:
                type: string
                example: /api/v1/habits/3fa85f64-5717-4562-b3fc-2c963f66afa6
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
        - bearerAuth: []

  /habits/{habitId}:
    parameters:
      - $ref: '#/components/parameters/HabitId'
    get:
      tags: [habits]
      operationId: getHabit
      summary: Получить одну привычку
      responses:
        '200':
          description: Привычка найдена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []
    patch:
      tags: [habits]
      operationId: updateHabit
      summary: Частично изменить привычку
      description: |
        Меняет только переданные поля, остальные остаются как были.
        Чтобы отправить привычку в архив, передайте archived = true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HabitUpdate'
            example:
              archived: true
      responses:
        '200':
          description: Привычка изменена, в ответе её новое состояние.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []
    delete:
      tags: [habits]
      operationId: deleteHabit
      summary: Удалить привычку
      description: Удаляет привычку насовсем. Если нужно просто спрятать, лучше архивировать через PATCH.
      responses:
        '204':
          description: Привычка удалена, тела ответа нет.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT, выданный сервисом авторизации. По нему определяется текущий пользователь.

  parameters:
    HabitId:
      name: habitId
      in: path
      required: true
      description: Идентификатор привычки (UUID).
      schema:
        type: string
        format: uuid

  schemas:
    StatusFilter:
      type: string
      description: Какие привычки показывать в списке.
      enum: [active, archived, all]
      default: active

    Frequency:
      type: string
      description: Как часто нужно выполнять привычку.
      enum: [DAILY, WEEKLY]

    Habit:
      type: object
      description: Привычка в том виде, в каком её видит клиент.
      required: [id, title, frequency, targetPerPeriod, archived, currentStreak, createdAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          minLength: 1
          maxLength: 100
          example: Пить воду
        description:
          type: string
          maxLength: 500
          example: Два литра в день
        frequency:
          $ref: '#/components/schemas/Frequency'
        targetPerPeriod:
          type: integer
          minimum: 1
          maximum: 7
          description: Сколько раз за период нужно выполнить привычку.
          example: 1
        archived:
          type: boolean
          description: Привычка в архиве и не показывается в списке по умолчанию.
          example: false
        currentStreak:
          type: integer
          minimum: 0
          readOnly: true
          description: Сколько периодов подряд привычка выполнена. Считает сервер.
          example: 5
        createdAt:
          type: string
          format: date-time
          readOnly: true

    HabitCreate:
      type: object
      description: Данные для создания привычки. Поля id, владелец и серия считает сервер.
      required: [title, frequency]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        frequency:
          $ref: '#/components/schemas/Frequency'
        targetPerPeriod:
          type: integer
          minimum: 1
          maximum: 7
          default: 1

    HabitUpdate:
      type: object
      description: Частичное изменение привычки. Нужно передать хотя бы одно поле.
      minProperties: 1
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        frequency:
          $ref: '#/components/schemas/Frequency'
        targetPerPeriod:
          type: integer
          minimum: 1
          maximum: 7
        archived:
          type: boolean

    HabitPage:
      type: object
      description: Страница списка привычек.
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Habit'
        total:
          type: integer
          minimum: 0
          description: Сколько всего привычек подходит под фильтр.
        limit:
          type: integer
        offset:
          type: integer

    Error:
      type: object
      description: Единый формат ошибки.
      required: [code, message]
      properties:
        code:
          type: string
          description: Машиночитаемый код причины.
          example: habit_not_found
        message:
          type: string
          description: Объяснение для человека. Внутренности сервера (стек, SQL) сюда не попадают.
          example: Привычка не найдена
        fieldErrors:
          type: array
          description: Какие поля не прошли проверку (только для 400).
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      description: Ошибка в одном поле запроса.
      required: [field, message]
      properties:
        field:
          type: string
          example: title
        message:
          type: string
          example: не может быть пустым

  responses:
    BadRequest:
      description: |
        Запрос некорректен: неверный параметр, пустое или слишком длинное поле,
        пустое тело у PATCH. Исправьте запрос и повторите.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: validation_failed
            message: Запрос не прошёл проверку
            fieldErrors:
              - field: title
                message: не может быть пустым
    Unauthorized:
      description: |
        Сервис не знает, кто вы: заголовок Authorization отсутствует, токен просрочен
        или подпись неверна. Получите новый токен и повторите.
      headers:
        WWW-Authenticate:
          description: Схема аутентификации.
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: unauthorized
            message: Нужен действующий токен
    Forbidden:
      description: |
        Сервис знает, кто вы, но эта привычка принадлежит другому пользователю.
        Повторять запрос с тем же токеном бессмысленно.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: forbidden
            message: Эта привычка вам не принадлежит
    NotFound:
      description: Привычки с таким идентификатором нет.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: habit_not_found
            message: Привычка не найдена
    Conflict:
      description: Привычка с таким названием у вас уже есть.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: habit_already_exists
            message: Привычка с таким названием уже есть
